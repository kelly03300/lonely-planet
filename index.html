<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>
        寂寞星球｜免費匿名聊天・找陌生人聊天
    </title>

    <meta
        name="description"
        content="寂寞星球是一個免費匿名聊天室，讓你找陌生人聊天、隨機配對，分享心情與想說的話。不用註冊，隨時找個人聊聊。"
    >

    <meta
        name="keywords"
        content="寂寞聊天,免費聊天,匿名聊天,陌生人聊天,找人聊天,免費聊天室,匿名聊天室,陌生人聊天室,深夜聊天"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://lonely-planet-chat.onrender.com/"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Open Graph -->
    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="寂寞星球｜免費匿名聊天・找陌生人聊天"
    >

    <meta
        property="og:description"
        content="寂寞星球是一個免費匿名聊天室，讓你找陌生人聊天、隨機配對，分享心情與想說的話。"
    >

    <meta
        property="og:url"
        content="https://lonely-planet-chat.onrender.com/"
    >

    <meta
        property="og:site_name"
        content="寂寞星球"
    >

    <meta
        property="og:locale"
        content="zh_TW"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         首頁
    ========================= -->

    <div
        class="container"
        id="home"
    >

        <h1>
            🌌 寂寞星球
        </h1>

        <div class="subtitle">
            陌生人匿名聊天室
        </div>

        <p>
            每個人都有一些，想找人說說的話。
        </p>

        <p>
            在寂寞星球，你可以免費匿名地和陌生人聊天，
            隨機找一個人聊聊，分享今天的心情。
        </p>

        <button
            id="startChat"
            type="button"
        >
            🌙 找個人聊聊
        </button>

    </div>


    <!-- =========================
         聊天室
    ========================= -->

    <div
        class="chat-page"
        id="chatPage"
    >


        <!-- 聊天室頂部 -->

        <div class="chat-header">

            <div class="chat-title">

                <h2>
                    🌙 寂寞星球
                </h2>

                <span>
                    你正在和一位陌生人聊天
                </span>

            </div>


            <button
                class="leave-btn"
                id="leaveChat"
                type="button"
            >
                離開
            </button>

        </div>


        <!-- =========================
             訊息區
        ========================= -->

        <div
            class="messages"
            id="messages"
        >

            <div class="message other">

                <span class="name">
                    寂寞星球
                </span>

                <div class="bubble">
                    🌙 正在準備聊天室……
                </div>

            </div>

        </div>


        <!-- =========================
             輸入區
        ========================= -->

        <div class="chat-input">

            <input
                type="text"
                id="messageInput"
                placeholder="想說什麼，都可以慢慢說..."
                autocomplete="off"
                autocorrect="on"
                autocapitalize="sentences"
                spellcheck="true"
                enterkeyhint="send"
            >

            <button
                id="sendMessage"
                type="button"
            >
                送出
            </button>

        </div>

    </div>


    <!-- Socket.io -->

    <script src="/socket.io/socket.io.js"></script>


    <!-- 聊天功能 -->

    <script src="script.js"></script>


</body>

</html>
